<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scoreboard</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Scoreboard">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#0d1117; --surface:#151a22; --line:#252c38; --text:#eef1f6; --muted:#8893a5;
  --gold:#f4b73f; --gold-2:#ffd978; --gold-ink:#1a1204; --ember:#ff6a3d; --glow:rgba(244,183,63,.35);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    color-scheme:light;
    --bg:#f5f3ee; --surface:#ffffff; --line:#e2ded4; --text:#14171c; --muted:#6b7280;
    --gold:#d9951a; --gold-2:#f0b94a; --gold-ink:#1a1204; --glow:rgba(217,149,26,.3);
  }
}
:root[data-theme="dark"]{color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:500 16px/1.5 Barlow,system-ui,sans-serif;
  background-image:radial-gradient(900px 420px at 50% -120px,var(--glow),transparent 70%);background-repeat:no-repeat}
.wrap{max-width:760px;margin:0 auto;padding:36px 20px 80px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:28px}
h1{font:800 clamp(40px,8vw,64px)/.9 "Barlow Condensed",Impact,sans-serif;letter-spacing:.01em;margin:0;text-transform:uppercase}
.tools{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.icon{background:transparent;border:1px solid var(--line);color:var(--muted);height:38px;padding:0 14px;border-radius:8px;font:600 14px Barlow,sans-serif;cursor:pointer}
.icon:hover:not(:disabled){color:var(--text);border-color:var(--muted)}
.icon:disabled{opacity:.35;cursor:default}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.add{display:flex;gap:10px;margin-bottom:32px}
.add input{flex:1;min-width:0;height:48px;padding:0 16px;background:var(--surface);border:1px solid var(--line);border-radius:10px;color:var(--text);font:500 16px Barlow,sans-serif}
.add input::placeholder{color:var(--muted)}
.add input:focus{outline:none;border-color:var(--gold)}
.btn{height:48px;padding:0 22px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--text);font:700 17px "Barlow Condensed",sans-serif;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;transition:transform .08s}
.btn:active{transform:scale(.96)}
.btn.win{background:linear-gradient(180deg,var(--gold-2),var(--gold));color:var(--gold-ink);border-color:transparent;box-shadow:0 6px 22px -8px var(--glow)}
.btn.win:hover{box-shadow:0 8px 28px -4px var(--glow)}
.btn.ghost{background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--text);border-color:var(--muted)}

.row{display:grid;grid-template-columns:44px 1fr auto;gap:6px 16px;align-items:center;padding:20px 0;border-top:1px solid var(--line);position:relative}
.row:last-child{border-bottom:1px solid var(--line)}
.rank{font:800 34px/1 "Barlow Condensed",sans-serif;color:var(--muted)}
.row.first .rank{color:var(--gold)}
.name{font:700 26px/1.1 "Barlow Condensed",sans-serif;letter-spacing:.02em;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.del{background:none;border:0;color:var(--muted);cursor:pointer;font-size:18px;padding:0 4px;opacity:.5}
.del:hover{opacity:1;color:var(--ember)}
.streak{font:700 13px Barlow,sans-serif;color:var(--ember);border:1px solid color-mix(in srgb,var(--ember) 50%,transparent);border-radius:99px;padding:1px 9px}
.stats{grid-column:2;display:flex;flex-wrap:wrap;gap:4px 22px;color:var(--muted);font-size:15px}
.stats b{color:var(--text);font:700 20px "Barlow Condensed",sans-serif;margin-left:4px}
.bar{grid-column:2;height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--gold-2));border-radius:4px;transition:width .7s cubic-bezier(.2,.9,.2,1)}
.rate{grid-column:3;grid-row:1 / span 2;text-align:right;font:800 46px/1 "Barlow Condensed",sans-serif;font-variant-numeric:tabular-nums}
.rate small{font-size:24px;color:var(--muted);margin-left:2px}
.row.first .rate{color:var(--gold)}
.acts{grid-column:2 / span 2;display:flex;gap:10px;margin-top:10px}
.acts .btn{height:42px;font-size:16px}
.acts .win{flex:1.4}.acts .ghost{flex:1}
.pop .rate,.pop .stats b{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.28);color:var(--gold)}100%{transform:scale(1)}}
.hit::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,var(--glow),transparent);opacity:0;animation:sweep .8s ease-out;pointer-events:none}
@keyframes sweep{0%{opacity:1;transform:translateX(-40%)}100%{opacity:0;transform:translateX(40%)}}
.empty{border:1px dashed var(--line);border-radius:12px;padding:40px 20px;text-align:center;color:var(--muted)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
#flash{position:fixed;inset:0;pointer-events:none;z-index:40;opacity:0;background:radial-gradient(circle at 50% 55%,transparent 30%,var(--glow) 100%)}
#flash.go{animation:flash .6s ease-out}
@keyframes flash{0%{opacity:1}100%{opacity:0}}
#banner{position:fixed;left:0;right:0;top:36%;text-align:center;pointer-events:none;z-index:60;opacity:0;
  font:800 clamp(54px,14vw,120px)/1 "Barlow Condensed",Impact,sans-serif;text-transform:uppercase;color:var(--gold-2);text-shadow:0 0 40px var(--glow),0 4px 0 rgba(0,0,0,.25)}
#banner small{display:block;font:600 clamp(16px,3.5vw,24px) Barlow,sans-serif;color:var(--text);text-shadow:none;letter-spacing:.08em;margin-top:6px}
#banner.go{animation:banner 1.3s cubic-bezier(.2,.9,.2,1)}
@keyframes banner{0%{opacity:0;transform:scale(.6)}15%{opacity:1;transform:scale(1.08)}30%{transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:scale(1.04) translateY(-12px)}}
.start{width:100%;height:56px;font-size:22px;margin-bottom:28px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:28px}
.panel h2,dialog h2{font:800 28px/1 "Barlow Condensed",sans-serif;text-transform:uppercase;margin:0 0 6px}
.hint{color:var(--muted);margin:0 0 16px;font-size:15px}
.picks,.chips{display:flex;flex-wrap:wrap;gap:10px}
.pick{height:64px;flex:1 1 140px;font-size:24px}
.chip{height:42px;padding:0 18px;border-radius:99px;border:1px solid var(--line);background:transparent;color:var(--text);font:600 16px Barlow,sans-serif;cursor:pointer}
.chip.on{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.gact{display:flex;gap:10px;margin-top:18px}
.btn:disabled{opacity:.4;cursor:default}
dialog{width:min(560px,calc(100% - 32px));background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:22px}
dialog::backdrop{background:rgba(0,0,0,.65)}
dialog textarea{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:12px;font:13px/1.4 ui-monospace,Menlo,monospace;resize:vertical}
.dact{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.dact .btn{height:42px;font-size:15px;padding:0 16px}
#msg{margin:12px 0 0;min-height:1.4em}
.add{margin-bottom:14px}
.swatches{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:32px}
dialog .swatches{margin:8px 0 4px}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid transparent;background:var(--c);cursor:pointer;padding:0;position:relative;display:inline-block;transition:transform .08s}
.sw:hover{transform:scale(1.12)}
.sw.on{border-color:var(--text);box-shadow:0 0 0 2px var(--bg)}
.cust{background:conic-gradient(#e5484d,#f4b73f,#30a46c,#00a2c7,#8e4ec6,#e5484d)}
.cust.on{background:var(--c)}
.cust input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;border:0;padding:0}
.dot{width:16px;height:16px;border-radius:50%;background:var(--pc,var(--gold));border:0;padding:0;cursor:pointer;flex:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--pc,var(--gold)) 25%,transparent)}
.dot:hover{transform:scale(1.2)}
.aim{font-size:22px;line-height:1}
.row .bar i{background:var(--pc,var(--gold))}
.pick{border:2px solid var(--pc);background:color-mix(in srgb,var(--pc) 14%,var(--surface));color:var(--text)}
.pick:hover{background:color-mix(in srgb,var(--pc) 30%,var(--surface))}
.chip{display:inline-flex;align-items:center;gap:8px}
.chip .cd{width:10px;height:10px;border-radius:50%;background:var(--pc)}
.chip.on{background:color-mix(in srgb,var(--pc) 24%,transparent);border-color:var(--pc);color:var(--text)}
.btn.danger{border-color:var(--ember);color:var(--ember)}
.btn.danger:hover:not(:disabled){background:var(--ember);color:#fff}
dialog input[type=text]{width:100%;height:46px;padding:0 14px;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:10px;font:500 16px Barlow,sans-serif}
#dart{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;overflow-y:auto;padding:max(10px,env(safe-area-inset-top,0px)) max(8px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
#dart[hidden]{display:none}
#dart>*{flex-shrink:0}
.dhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;width:100%;max-width:560px;margin-left:auto;margin-right:auto}
.dtitle{font:800 22px/1 "Barlow Condensed",sans-serif;text-transform:uppercase;text-align:center}
.dplayers{display:flex;gap:8px;overflow-x:auto;padding:4px 2px;width:100%;max-width:560px;margin:0 auto}
.pc{flex:1 0 108px;border:2px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--surface)}
.pc.cur{border-color:var(--pc);box-shadow:0 0 0 3px color-mix(in srgb,var(--pc) 25%,transparent)}
.pc .n{display:flex;align-items:center;gap:6px;font:700 18px "Barlow Condensed",sans-serif;white-space:nowrap;overflow:hidden}
.pc .r{font:800 46px/1 "Barlow Condensed",sans-serif;font-variant-numeric:tabular-nums}
.pc .a{color:var(--muted);font-size:13px;white-space:nowrap}
.pc .lg{margin-left:auto;font:800 20px/1.2 "Barlow Condensed",sans-serif;color:var(--gold);border:1px solid var(--gold);border-radius:6px;padding:0 8px}
.dot2{width:12px;height:12px;border-radius:50%;background:var(--pc);display:inline-block;flex:none}
.dturn{display:flex;align-items:center;gap:8px;margin:10px auto;min-height:48px;width:100%;max-width:560px}
.dturn .who{display:flex;align-items:center;gap:8px;font:700 22px "Barlow Condensed",sans-serif;margin-right:auto;min-width:0}
.slot{min-width:54px;height:46px;border-radius:10px;border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;font:800 24px "Barlow Condensed",sans-serif;color:var(--muted)}
.slot.f{border-style:solid;border-color:var(--pc);color:var(--text);background:color-mix(in srgb,var(--pc) 16%,transparent)}
.slot.t{color:var(--gold)}.slot.d{color:var(--gold-2)}
.slot.bad{border-color:var(--ember);color:var(--ember);background:transparent}
.dsum{min-width:48px;text-align:right;font:800 32px/1 "Barlow Condensed",sans-serif}
.dsum.bad{color:var(--ember);text-transform:uppercase}
.bw{width:100%;max-width:560px;margin:0 auto;touch-action:manipulation}
#board{width:100%;height:auto;display:block;-webkit-tap-highlight-color:transparent;transition:opacity .2s;user-select:none;-webkit-user-select:none}
#board path,#board circle{stroke:#0a0d12;stroke-width:1.5}
#board [data-s]{cursor:pointer}
#board .bn{fill:#cfd6e2;stroke:none;font:700 18px "Barlow Condensed",sans-serif;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.bw.locked #board{opacity:.3;pointer-events:none}
.seg-hit{animation:seg .45s ease-out}
@keyframes seg{0%{filter:brightness(2.6)}100%{filter:brightness(1)}}
.dbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px auto 0;width:100%;max-width:560px}
.dbtns .btn{height:64px;font-size:20px;padding:0 6px}
.dbtns .dnext{grid-column:1 / -1;height:72px;font-size:26px}
#banner.bad{color:var(--ember);text-shadow:0 0 40px rgba(255,106,61,.4)}
#banner.cold{color:#7dd3fc;text-shadow:0 0 40px rgba(125,211,252,.4)}
.dfin{display:flex;align-items:center;gap:8px;width:100%;max-width:560px;margin:0 auto 8px;min-height:44px;color:var(--muted)}
.dfin .fl{font:600 14px Barlow,sans-serif;margin-right:2px}
.dfin b{font:800 24px/1 "Barlow Condensed",sans-serif;color:var(--gold);padding:6px 12px;border:1px solid color-mix(in srgb,var(--gold) 55%,transparent);border-radius:8px;background:color-mix(in srgb,var(--gold) 12%,transparent)}
.dfin i{font-style:normal}
.startrow{display:flex;gap:10px;margin-bottom:28px}
.startrow .start{flex:1;width:auto;margin-bottom:0}
#stats{position:fixed;inset:0;z-index:30;background:var(--bg);background-image:radial-gradient(900px 380px at 50% -120px,var(--glow),transparent 70%);background-repeat:no-repeat;overflow-y:auto;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#stats[hidden]{display:none}
.sx{max-width:980px;margin:0 auto}
.shead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.shead h2{font:800 clamp(32px,6vw,48px)/1 "Barlow Condensed",Impact,sans-serif;text-transform:uppercase;margin:0;display:flex;align-items:center;gap:12px}
.splist{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.spc{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--pc);border-radius:12px;padding:16px 18px;text-align:left;color:var(--text);cursor:pointer;font:inherit}
.spc:hover{border-color:var(--pc)}
.spc b{display:block;font:800 30px/1.1 "Barlow Condensed",sans-serif}
.spc span{color:var(--muted);font-size:14px}
.sgrid{display:grid;grid-template-columns:1fr;gap:24px;align-items:start}
@media (min-width:860px){.sgrid{grid-template-columns:1.1fr .9fr}}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tile small{display:block;color:var(--muted);font-size:13px;margin-bottom:2px}
.tile b{font:800 38px/1 "Barlow Condensed",sans-serif;font-variant-numeric:tabular-nums}
.tile i{display:block;font-style:normal;color:var(--muted);font-size:12.5px;margin-top:3px}
.tile.hi b{color:var(--gold)}
.sh3{font:800 20px "Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:22px 0 10px}
.sh3:first-child{margin-top:0}
.heat{width:100%;max-width:460px;margin:0 auto;display:block}
.heat path,.heat circle{stroke:var(--bg);stroke-width:2}
.heat .bn{fill:var(--muted);stroke:none;font:700 18px "Barlow Condensed",sans-serif;text-anchor:middle;dominant-baseline:central}
.dist{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--line)}
.dist i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:8px;color:var(--muted);font-size:13px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);margin-right:6px}
.top{display:grid;gap:8px}
.top>div{display:grid;grid-template-columns:84px 1fr 48px;gap:10px;align-items:center;font-size:14px}
.top .bar2{height:8px;background:var(--line);border-radius:5px;overflow:hidden}
.top .bar2 i{display:block;height:100%;background:var(--pc)}
.top .n{text-align:right;color:var(--muted)}
@media (orientation:portrait) and (min-width:600px){
  #dart{--bs:clamp(360px,calc(100vh - 450px),min(100%,780px))}
  @supports (height:100dvh){#dart{--bs:clamp(360px,calc(100dvh - 450px),min(100%,780px))}}
  .dhead,.dplayers,.dturn,.dfin,.dbtns{max-width:var(--bs)}
  .bw{max-width:none;width:var(--bs)}
}
@media (orientation:landscape) and (min-width:640px){
  #dart{display:grid;grid-template-columns:auto minmax(300px,1fr);grid-template-rows:auto auto auto auto 1fr;column-gap:20px;row-gap:6px}
  .bw{grid-column:1;grid-row:1 / 6;width:min(calc(100vh - 24px),calc(100vw - 360px));max-width:none;margin:0;align-self:center}
  @supports (height:100dvh){.bw{width:min(calc(100dvh - 24px),calc(100vw - 360px))}}
  .dhead,.dplayers,.dturn,.dfin,.dbtns{grid-column:2;max-width:none;margin:0}
  .dplayers{flex-wrap:wrap;overflow:visible}
  .pc{flex:1 0 140px}
  .dbtns{align-self:end}
  .dbtns .btn{font-size:18px}
}
#board .tgt{animation:tg .8s ease-in-out infinite alternate}
@keyframes tg{from{filter:brightness(1)}to{filter:brightness(2)}}
@media (prefers-reduced-motion:reduce){#board .tgt{animation:none;filter:brightness(1.7)}}
@media (max-width:520px){.rate{font-size:38px}.stats{gap:14px}}
@media (prefers-reduced-motion:reduce){.pop .rate,.pop .stats b,.hit::after,#flash.go,#banner.go{animation:none}#banner.go{opacity:1;animation:none}}
</style>
</head>
<body>
<canvas id="fx"></canvas><div id="flash"></div><div id="banner"></div>
<div id="dart" hidden>
  <div class="dhead"><button class="icon" id="dClose">Schließen</button><div class="dtitle" id="dTitle"></div><button class="icon" id="dUndo">Dart zurück</button></div>
  <div class="dplayers" id="dPlayers"></div>
  <div class="dturn" id="dTurn"></div>
  <div class="dfin" id="dFin"></div>
  <div class="bw" id="bw"><svg id="board" viewBox="0 0 500 500" role="group" aria-label="Dartscheibe"></svg></div>
  <div class="dbtns" id="dBtns"></div></div>
<div id="stats" hidden><div class="sx" id="sx"></div>
</div>
<div class="wrap">
  <header>
    <h1>Scoreboard</h1>
    <div class="tools">
      <button class="icon" id="statBtn">Statistik</button><button class="icon" id="dataBtn">Daten</button><button class="icon" id="undo" disabled>Rückgängig</button>
      <button class="icon" id="mute" aria-pressed="false">Sound an</button>
    </div>
  </header>
  <div class="add">
    <input id="name" type="text" maxlength="24" placeholder="Name des Spielers" autocomplete="off">
    <button class="btn" id="addBtn">Anlegen</button>
  </div>
  <div class="swatches" id="addSw" aria-label="Farbe wählen"></div>
  <section id="game"></section>
  <main id="list"></main>
</div>
<dialog id="dlg">
  <h2>Daten</h2>
  <p class="hint">Export als Datei oder Text. Einlesen ersetzt den kompletten aktuellen Stand, per Rückgängig holst du ihn zurück.</p>
  <textarea id="json" rows="9" spellcheck="false"></textarea>
  <div class="dact">
    <button class="btn win" id="saveFile">Als Datei speichern</button>
    <button class="btn" id="copy">Kopieren</button>
    <button class="btn" id="loadFile">Datei laden</button>
    <button class="btn" id="doImport">Einlesen</button>
    <button class="btn ghost" id="close">Schließen</button>
  </div>
  <p class="hint" id="msg"></p>
  <input type="file" id="file" accept=".json,application/json" hidden>
</dialog>
<dialog id="colDlg"><h2>Farbe wählen</h2><div class="swatches" id="colSw"></div><div class="dact"><button class="btn ghost" id="colClose">Schließen</button></div></dialog>
<dialog id="delDlg"><h2>Spieler löschen</h2><p class="hint" id="delTxt"></p><input id="delIn" type="text" autocomplete="off" aria-label="Namen zur Bestätigung eintippen"><div class="dact"><button class="btn danger" id="delGo" disabled>Endgültig löschen</button><button class="btn ghost" id="delNo">Abbrechen</button></div>
</dialog>
<script>
(function(){
  var KEY="scoreboard-v1", players=[], snapshot=null, muted=false, game=null, picking=false, selected=[], newColor=null, colorTarget=null, delTarget=null, session=null,
      PAL=["#f4b73f","#ff6a3d","#e5484d","#d6409f","#8e4ec6","#3e63dd","#00a2c7","#30a46c","#99d52a","#8b8d98"];

      return;
    }
    var s=p.st||{g:0,darts:0,pts:0,turns:0,max:0,c180:0,c140:0,c100:0,busts:0,hiCO:0,seg:{},best:{}},t=segTotals(s.seg);
    var head='<div class="shead"><h2><i class="dot2" style="--pc:'+colorOf(p)+'"></i>'+esc(p.name)+'</h2><div class="tools"><button class="icon" data-sx="back">Spieler</button><button class="icon" data-sx="close">Schließen</button></div></div>';
    var general=tile("Siege / Spiele",(p.wins||0)+" / "+p.games,"Winrate "+fmt(rate(p))+" %",true);
    if(!s.darts){
      sx.innerHTML=head+'<div class="tiles">'+general+'</div><p class="hint" style="margin-top:18px">Noch keine Dart-Daten. Die Statistik füllt sich, sobald ein Darts-Spiel oder Training zu Ende gespielt wurde. Abgebrochene Spiele zählen nicht.</p>';
      return;
    }
    var tiles=tile("Ø pro 3 Darts",fmt(s.pts/s.darts*3),sNum(s.darts)+" Darts in "+s.g+(s.g===1?" Spiel":" Spielen"),true)+
      tile("Höchste Runde",s.max||"–",s.turns?"aus "+sNum(s.turns)+" Runden":"",true)+
      tile("180er",s.c180,"",s.c180>0)+tile("140–179",s.c140,"")+tile("100–139",s.c100,"")+
      tile("High Finish",s.hiCO||"–","",s.hiCO>0)+
      tile("Double-Quote",pct(p.dHit||0,p.dAtt||0),p.dAtt?(p.dHit||0)+" von "+p.dAtt+" Darts auf Double":"",true)+
      tile("Triple 20",sNum(s.seg.T20||0),pct(s.seg.T20||0,t.all)+" aller Darts",true)+
      tile("Triples",sNum(t.t),pct(t.t,t.all))+tile("Doubles",sNum(t.d),pct(t.d,t.all))+
      tile("Bullseye",sNum(t.b50),pct(t.b50,t.all))+tile("Bull 25",sNum(t.b25),pct(t.b25,t.all))+
      tile("Daneben",sNum(t.m),pct(t.m,t.all))+
      tile("Busts",s.busts,s.turns?pct(s.busts,s.turns)+" der Runden":"")+tile("Legs gewonnen",sNum(s.legs||0),"")+general;
    Object.keys(s.best).sort(function(a,b){return a-b;}).forEach(function(k){tiles+=tile("Bestes "+k+"er Leg",s.best[k]+" Darts","mit Double-Out",true);});
    var parts=[["Single",t.s,"var(--muted)"],["Double",t.d,"var(--gold)"],["Triple",t.t,"var(--ember)"],["Bull",t.b25+t.b50,"#30a46c"],["Daneben",t.m,"#4a5262"]];
    var dist='<div class="dist">'+parts.map(function(q){return q[1]?'<i style="width:'+(q[1]/t.all*100)+'%;background:'+q[2]+'"></i>':'';}).join("")+'</div><div class="legend">'+parts.map(function(q){return '<span style="--c:'+q[2]+'">'+q[0]+' '+pct(q[1],t.all)+'</span>';}).join("")+'</div>';
    var ks=Object.keys(s.seg).filter(function(k){return k!=="M";}).sort(function(a,b){return s.seg[b]-s.seg[a];}).slice(0,6),mx=ks.length?s.seg[ks[0]]:1;
    var top='<div class="top" style="--pc:'+colorOf(p)+'">'+ks.map(function(k){return '<div><span>'+segName(k)+'</span><span class="bar2"><i style="width:'+(s.seg[k]/mx*100)+'%"></i></span><span class="n">'+sNum(s.seg[k])+'</span></div>';}).join("")+'</div>';
    sx.innerHTML=head+'<div class="sgrid"><div><div class="tiles">'+tiles+'</div></div><div><div class="sh3">Trefferbild</div>'+heatSvg(s.seg,colorOf(p))+'<div class="sh3">Verteilung</div>'+dist+'<div class="sh3">Lieblingsfelder</div>'+top+'</div></div>';
  }
  document.getElementById("statBtn").onclick=function(){statsOpen=true;statSel=null;document.body.style.overflow="hidden";renderStats();document.getElementById("stats").scrollTop=0;};
  document.getElementById("sx").addEventListener("click",function(e){
    var b=e.target.closest("[data-sx]");if(!b)return;var v=b.dataset.sx;
    if(v==="close"){statsOpen=false;document.body.style.overflow="";renderStats();}
    else if(v==="back"){statSel=null;renderStats();}
    else{statSel=v;renderStats();document.getElementById("stats").scrollTop=0;}
  });

  /* Aktionen */
  function addPlayer(){
    var inp=document.getElementById("name"),n=inp.value.trim();
    if(!n){inp.focus();return;}
    if(players.some(function(p){return p.name.toLowerCase()===n.toLowerCase();})){inp.select();return;}
    take();players.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),name:n,games:0,wins:0,streak:0,color:newColor});
    inp.value="";newColor=nextColor();renderAddSw();save();render();
  }
  document.getElementById("addBtn").onclick=addPlayer;
  document.getElementById("name").addEventListener("keydown",function(e){if(e.key==="Enter")addPlayer();});

  document.getElementById("list").addEventListener("click",function(e){
    var btn=e.target.closest("[data-act]");if(!btn)return;
    var row=btn.closest(".row"),id=row.dataset.id,p=players.filter(function(x){return x.id===id;})[0];if(!p)return;
    var act=btn.dataset.act;if(act==="color"){openColor(p);return;}
    if(act==="del"){
      
      askDelete(p);return;
    }
    take();p.games++;
    if(act==="win"){p.wins++;p.streak++;}else{p.streak=0;}
    save();render(id,act==="win"?id:null);
    if(act==="win"){var nb=document.querySelector('.row[data-id="'+id+'"] [data-act="win"]');celebrate(nb||btn,p);}
  });

  document.getElementById("undo").onclick=function(){
    if(!snapshot)return;players=JSON.parse(snapshot);snapshot=null;this.disabled=true;save();render();
  };
  var mb=document.getElementById("mute");
  function paintMute(){mb.textContent=muted?"Sound aus":"Sound an";mb.setAttribute("aria-pressed",muted);}
  mb.onclick=function(){muted=!muted;paintMute();save();};
  players.forEach(function(p,i){if(!/^#[0-9a-f]{6}$/i.test(p.color||""))p.color=PAL[i%PAL.length];});newColor=nextColor();renderAddSw();paintMute();render();
})();
</script>
</body>
</html>
